[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-adapter"
version = "0.2.0"
description = "Parameter-efficient compressed sparse adaptation for ASR"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Xianchao Wu"}]
dependencies = [
  "torch>=2.2",
  "transformers==4.57.6",
  "datasets==3.6.0",
  "scipy>=1.10",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "soundfile>=0.12",
  "jiwer>=3.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
csa-train = "csa_adapter.longform.train:main"
csa-eval = "csa_adapter.longform.evaluate:main"
csa-prepare = "csa_adapter.longform.data:prepare"
csa-cache = "csa_adapter.longform.cache:main"
csa-list-datasets = "csa_adapter.data.registry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
